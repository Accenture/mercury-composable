#
# IMPORTANT:
# ---------
# The cron interval must be set to more than 10 seconds
# because deferred.start below sets a random delay of 0 to 9 seconds
#
jobs:
  - name: "demo-task"
    description: "execute demo service every 10 seconds"
    cron: "0/10 0/1 * 1/1 * ? *"
    service: "hello.world"
    # optional parameter to tell the service what to do
    parameters:
      hello: "world"
    resolver: "v1.state.resolver"

  - name: "demo-flow"
    description: "execute demo service every 10 seconds"
    cron: "0/10 0/1 * 1/1 * ? *"
    service: "flow://hello-flow"
    # optional parameter to tell the service what to do
    parameters:
      hello: "flow"
    resolver: "v1.state.resolver"

  - name: "standby-probe"
    description: "fired by ActiveEnvironmentTest through the job executor - this cron never matches before 2099"
    cron: "0 0 0 1 1 ? 2099"
    service: "standby.probe"
    parameters:
      probe: "yes"
    resolver: "v1.state.resolver"

  - name: "eastern-probe"
    description: "09:00 New York time, read by TimeZoneTest - this cron never matches before 2099"
    cron: "0 0 9 * * ? 2099"
    timezone: "America/New_York"
    service: "timezone.probe"
    resolver: "timezone.probe.resolver"

  - name: "retry-probe"
    description: "a state resolver that answers its first question late, read by ResolverRetryTest - this cron never matches before 2099"
    cron: "0 0 0 1 1 ? 2099"
    service: "retry.probe"
    resolver: "retry.probe.resolver"
    parameters:
      probe: "yes"
      _reserved: "a key that starts with _ is reserved for the system, so the loader drops it"

  - name: "misspelt-zone"
    description: "an unknown time zone, so TimeZoneTest finds this job rejected rather than run on GMT"
    cron: "0 0 9 * * ? 2099"
    timezone: "America/NewYork"
    service: "hello.world"
    resolver: "v1.state.resolver"

#
# deferred start adds a randomized delay of 0 to 9 seconds before a scheduled job runs.
# It spreads the instances' questions to the state resolver; with more than one instance, the
# resolver's "expires" claims the job in one conditional write (see the mini-scheduler README).
#
deferred.start: true

#
# For backward compatibility, set leader.election to true.
# This enables the use of minimalist service mesh for leader election.
# Your application must set cloud.connector to a service mesh (e.g. kafka)
# and call the "platform.connectToCloud()" API in the main application.
# You would need to add the kafka-connector dependency to turn on a service mesh.
#
leader.election: false
