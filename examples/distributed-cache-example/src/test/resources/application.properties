#
# Test config: the same app, but pointed at the embedded Redis TestBase starts (port 16385) instead of
# a standalone Redis, and on its own REST port. rest.yaml / flows.yaml come from the main classpath.
#
spring.application.name=distributed-cache-example-test
rest.server.port=8306
rest.automation=true
yaml.rest.automation=classpath:/rest.yaml
yaml.flow.automation=classpath:/flows.yaml
web.component.scan=org.platformlambda, com.accenture.cache.demo
log.format=text
cloud.connector=none
mandatory.health.dependencies=redis.health

redis.cache.enabled=true
redis.host=127.0.0.1
redis.port=16385
redis.cache.default.ttl=1h
redis.cache.key.prefix=cache-demo:

location.graph.temp=file:/tmp/graph-test
graph.model.automation=classpath:/graphs.yaml
graph.traversal.log=true
