#
# KafkaFlowAutoStartTest fixture: the opt-in key names a registry client template, so the flow adapter gets
# its own codec under the schema.registry.consumer prefix. It reuses the module's bundled template (whose auth
# block is fully commented out - fine under the embedded registry, which enforces no access control) and
# layers the one override that would differ in a per-direction installation: the consume identity pool.
# The embedded registry ignores the pool id; the test proves the wiring, not an access-control grant.
#
schema.registry.consumer.properties=classpath:/schema-registry.properties
schema.registry.consumer.serde.bearer.auth.identity.pool.id=pool-consume-test
schema.registry.consumer.cache.ttl=1h
