#
# Test template: a realistic OAuth 2.0 bearer-auth registry client config, used to prove that the
# serdes inherit it (see SchemaCodecCsfleConfigTest#serdeInheritsRegistryClientTemplate).
#
# bearer.auth.issuer.endpoint.url is required, not optional decoration. When credentials.source
# is set to OAUTHBEARER Confluent's OauthCredentialProvider.configure() validates the URL while the
# registry client is being constructed, and throws without it. Loading it also auto-registers the
# URL on the JVM-wide OAuth allow-list, which the test saves and restores. Nothing is called over the
# network here - only the config composition is asserted.
#
# The client secret comes from the environment with a placeholder fallback, so no literal
# credential-shaped value is committed. Unset is the normal case and the fallback applies;
# an environment may override it without editing this file.
#
bearer.auth.credentials.source=OAUTHBEARER
bearer.auth.issuer.endpoint.url=http://127.0.0.1:18081/oauth/token
bearer.auth.client.id=inherit-client
bearer.auth.client.secret=${TEST_SERDE_INHERIT_SECRET:test-secret}
bearer.auth.logical.cluster=lsrc-test
