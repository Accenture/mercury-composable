spring.application.name=distributed-cache-example
info.app.version=1.0.0
info.app.description=Distributed cache example - profile CRUD over v1.cache.redis at Layers 1, 2 and 3
#
# Server port when running locally
#
rest.server.port=8305
rest.automation=true
yaml.rest.automation=classpath:/rest.yaml
yaml.flow.automation=classpath:/flows.yaml
#
# scan the demo functions (the platform auto-registers its own org.platformlambda modules -
# v1.cache.redis, graph.executor - too; both are listed here to be explicit)
#
web.component.scan=org.platformlambda, com.accenture.cache.demo
#
# log.format = text | compact | json. The trace records (span_id / parent_span_id) and the
# app-context fields added by updateContext(...) are logged either way; json/compact render them
# as indexable key-values for an OTel/log pipeline.
#
log.format=json
cloud.connector=none
#
# Include the distributed cache's Redis health check in /health.
#
mandatory.health.dependencies=redis.health
#
# The distributed cache (opt-in). The RUNNABLE app expects a standalone Redis on 127.0.0.1:6379 -
# start helpers/redis-standalone first (see README.md). The unit test overrides redis.port with an
# embedded Redis in src/test/resources/application.properties.
#
redis.cache.enabled=true
redis.host=${REDIS_HOST:127.0.0.1}
redis.port=${REDIS_PORT:6379}
redis.cache.default.ttl=1h
# every layer shares the cache under this key namespace (the raw profile id is the key)
redis.cache.key.prefix=cache-demo:
#
# Knowledge Graph (Layer 3): compile the manifest-listed graphs at start-up and log the traversal.
#
location.graph.temp=file:/tmp/graph
graph.model.automation=classpath:/graphs.yaml
graph.traversal.log=true

#
# When app.env=dev is set, the minigraph-playground UI will be enabled.
# For production, this value should be removed.
#
app.env=dev
