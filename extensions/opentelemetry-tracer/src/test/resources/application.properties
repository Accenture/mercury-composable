application.name=otel-tracer-demo
server.port=8306
rest.automation=true
yaml.rest.automation=classpath:/rest.yaml
web.component.scan=org.platformlambda
log.format=text
cloud.connector=none
yaml.flow.automation=classpath:/flows.yaml
#
# the master switch; the test installs an OpenTelemetry SDK with an in-memory exporter as the global
# implementation before the platform starts, so the setup's observer records into it
#
otel.tracing=true
#
# the negative control of the experiment: this route never sees the incoming context
#
invocation.observer.unlinked=demo.unlinked
