#
# Application name, version and description are displayed under the management endpoint "/info".
#
# When running under IDE, spring.application.name and info.app.version will be used.
# Otherwise, the application name and version are retrieved from the packaged JAR file.
#
application.name=composable-example
info.app.version=1.0.0
info.app.description=Composable example using Event Script
#
# "rest.server.port" is the server port when running locally
# This value may be mapped to port 80 when deployed to cloud
#
# If this parameter is not available, it will fall back to use "server.port".
# This additional parameter allows rest-automation library to co-exist with the "rest-spring" library
#
# When used with rest-spring library, your application would use 2 ports:
# one for rest-automation ("rest.server.port") and the other for rest-spring ("server.port")
# In combined mode, please use "spring.application.name" instead of "application.name"
#
rest.server.port=8100
rest.automation=true
# optional server.port if you have added rest-spring-4 library in pom.xml
server.port=8085
#
# log.format = text | compact | json
# text and json are for human readers
# compact is json without pretty print. It is for log analytics consumption.
#
log.format=json
#
# --- OpenTelemetry trace forwarding (opentelemetry-forwarder on the classpath) -----------------
#
# Master switch, DEFAULT OFF. The dependency alone registers nothing: the forwarder is
# @OptionalService("otel.forwarding"), so with this false the route does not exist and the app runs
# exactly as it did before. DevOps turns it on per environment - in application.properties here, or
# without rebuilding via a JVM flag:
#
#   java -Dotel.forwarding=true -jar target/composable-example-x.y.z.jar
#
otel.forwarding=false
#
# Where traces go, and the backend credential. All three come from the ENVIRONMENT with no default, so
# no endpoint, header name or token is ever committed. An unset variable resolves to null, which parses
# to no header - the export then simply goes out unauthenticated and the backend rejects it, rather than
# the build carrying a secret.
#
# Backends differ in the header NAME and in whether the value carries an auth scheme. OTLP_AUTH_HEADER
# carries both of those vendor-specific parts in literal HTTP header syntax, so OTLP_TOKEN stays the
# bare secret and nothing but the secret - which keeps rotation to one variable:
#
#   # Dynatrace - header name plus the "Api-Token" scheme
#   export OTLP_API_ENDPOINT="https://<tenant>/api/v2/otlp/v1/traces"
#   export OTLP_AUTH_HEADER="Authorization: Api-Token"   # lint:allow-secret-material - header NAME and scheme only, no token
#   export OTLP_TOKEN="<your-api-token>"
#
#   # Splunk Observability Cloud - header name only, no scheme
#   export OTLP_API_ENDPOINT="https://ingest.<realm>.signalfx.com/v2/trace/otlp"
#   export OTLP_AUTH_HEADER="X-SF-Token:"
#   export OTLP_TOKEN="<your-access-token>"
#
# Note the trailing colon in the Splunk form: the colon separates the header name from its value, and
# the parser splits on the first ':' or '=', whichever comes first.
#
otel.exporter.otlp.endpoint=${OTLP_API_ENDPOINT}
otel.exporter.otlp.headers=${OTLP_AUTH_HEADER} ${OTLP_TOKEN}
# The service name is how traces are grouped in the backend. Deliberately OTLP_-prefixed, not the
# standard OTEL_SERVICE_NAME: OTEL_* variables are often exported machine-wide on instrumented hosts
# and CI agents, and inheriting one by accident would silently rename this app's traces (the same
# reasoning that keeps the forwarder's own tests off ${OTEL_*} references).
otel.service.name=${OTLP_SERVICE_NAME:composable-example}
# gzip is worth it straight to a SaaS backend over the internet; a local collector can use none.
otel.exporter.otlp.compression=gzip

#
# Where to load the static files:
# For embedded resources --> classpath:/public
# For files in local file system --> file:/opt/html
#
# Default welcome page is "index.html"
#
spring.web.resources.static-locations=classpath:/public

web.component.scan=com.accenture

#
# websocket configuration
#
#websocket.idle.timeout=60

#
# cloud.connector = none | kafka | ...
# cloud.services = comma separated list of optional cloud services
#
cloud.connector=none
#cloud.services=some.other.cloud.services

#
# health admin endpoint dependencies
#
mandatory.health.dependencies=demo.health
#mandatory.health.dependencies=cloud.connector.health
#optional.health.dependencies=cloud.connector.health

#
# advanced features
#
snake.case.serialization=true

#
# environment and system properties to be exposed to the "/env" admin endpoint
#
#show.env.variables=USER, TEST
show.application.properties=server.port, cloud.connector

#
# route substitution
# comma separated list. The format of each entry is a:b where b replaces a
#
#route.substitution=hello.test:hello.world
#application.feature.route.substitution=true

#
# REST automation configuration files
# (the system will merge config files if more than one is provided as a comma separated list)
#
yaml.rest.automation=file:/tmp/config/rest.yaml, classpath:/rest.yaml
#
# Event script configuration file location
#
yaml.flow.automation=classpath:/flows.yaml
#
# If api.origin is present, it will override "Access-Control-Allow-Origin" in the CORS headers
# Access-Control-Allow-Origin must be "*" or domain name starting with "http://" or "https://"
# The use of wildcard "*" should only be allowed for non-prod environments.
#
api.origin=*

#
# Event-over-http demo
# The event-over-http.yaml configuration file contains one or more route names
# that point to a peer application instance. The host and port are configured below.
#
# For this demo, the route name is "hello.declarative".
# The route does not exist in this application. The PostOffice resolves this
# foreign route through the event-over-http.yaml config file.
#
# The programmatic counterpart is the "/api/event/http/programmatic" endpoint whose
# flow task (v1.event.over.http.rpc) passes the peer's Event API endpoint URL directly
# to the PostOffice request API, calling the same peer function by its primary route
# name "hello.world" - no entry in event-over-http.yaml is needed. Both patterns share
# the peer host and port settings below.
#
yaml.event.over.http=classpath:/event-over-http.yaml
peer.demo.host=127.0.0.1
peer.demo.port=8085
#
# Shared demo secret for the Event-over-HTTP authentication demo. The called
# party's "event.api.auth" service expects this value in the "authorization"
# header. Resolved from the DEMO_PEER_TOKEN environment variable so no real
# credential is ever hard-coded ("demo" is the fallback for local development
# only). The declarative side reads the same variable in event-over-http.yaml.
#
demo.peer.token=${DEMO_PEER_TOKEN:demo}
