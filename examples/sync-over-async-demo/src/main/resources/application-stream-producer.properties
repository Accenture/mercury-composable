#
# Stream-producer role: a backend service that posts progressive events into a streaming
# rendezvous opened by a stream-ui pod - purely through Redis (StreamResponder).
#   java -Dspring.profiles.active=stream-producer -jar target/sync-over-async-demo-<version>.jar
#
# The producer side needs NO return-route coordinator (no subscriber, no return channel of its
# own) and no broker: only the redis.* connection parameters from application.properties.
#
rest.automation=true
rest.server.port=8601
yaml.rest.automation=classpath:/rest-stream-producer.yaml

# no coordinator on the producer side
sync.over.async.enabled=false

# no Kafka in this role
kafka.producer.enabled=false
kafka.consumer.enabled=false

# Real-LLM leg (produce mode "llm", experiment E4): the provider's SSE token stream is pulled
# by the platform's SSE-capable HTTP client and bridged into the rendezvous. Keep the key in
# the environment - blank disables the mode with an explicit 503.
llm.api.key=${GEMINI_API_KEY:}
llm.gemini.model=gemini-flash-latest
llm.gemini.host=https://generativelanguage.googleapis.com
