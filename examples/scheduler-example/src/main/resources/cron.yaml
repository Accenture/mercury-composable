#
# IMPORTANT:
# ---------
# A job's period must be more than the state resolver's window plus 9 seconds - 39 seconds with the
# example's 30-second window - because deferred.start below sets a random delay of 0 to 9 seconds
# and more than one instance may run the scheduler. The demo jobs run once a minute.
#
jobs:
  - name: "demo-task"
    description: "execute demo service every minute, at second 0"
    cron: "0 0/1 * 1/1 * ? *"
    # optional time zone of the cron statement, e.g. "America/New_York" - the JVM's default when absent
    # timezone: "America/New_York"
    service: "hello.world"
    # optional parameter to tell the service what to do
    parameters:
      hello: "world"
    resolver: "v1.state.resolver"

  - name: "demo-flow"
    description: "execute demo flow every minute, at second 30"
    cron: "30 0/1 * 1/1 * ? *"
    service: "flow://hello-flow"
    # In the demo flow, it has 2 tasks. We use input data mapping to map "db" and "other" parameters accordingly.
    # See "hello-flow.yml for details.
    parameters:
      db:
        host: "db://demo"
        feature: "read only"
      other:
        demo: "some value"
    resolver: "v1.state.resolver"

#
# deferred start adds a randomized delay of 0 to 9 seconds before a scheduled job runs.
# It spreads the instances' questions to the state resolver; with more than one instance, the
# resolver's "expires" claims the job in one conditional write (see the mini-scheduler README).
#
deferred.start: true

#
# For backward compatibility, set leader.election to true.
# This enables the use of minimalist service mesh for leader election.
# Your application must set cloud.connector to a service mesh (e.g. kafka)
# and call the "platform.connectToCloud()" API in the main application.
# You would need to add the kafka-connector dependency to turn on a service mesh.
#
leader.election: false
