application.name=lab-edge
info.app.version=4.12.26
info.app.description=Dynatrace OneAgent lab - the REST entry point
web.component.scan=com.accenture.lab
cloud.connector=none
rest.automation=true
rest.server.port=8100
yaml.rest.automation=classpath:/rest.yaml
yaml.flow.automation=classpath:/flows.yaml
# one JSON object per log line, which carries the log context (trace and span ids)
log.format=compact
#
# The live tracer under test, switched on by lab.sh up oneagent
dynatrace.oneagent.enabled=${DYNATRACE_ONEAGENT_ENABLED:false}
dynatrace.oneagent.destination=${DYNATRACE_ONEAGENT_DESTINATION:application-route}
dynatrace.oneagent.log.context=${DYNATRACE_ONEAGENT_LOG_CONTEXT:true}
#
# The negative control: observed, but never linked to its caller, so it must show as a separate fragment
invocation.observer.unlinked=lab.audit
