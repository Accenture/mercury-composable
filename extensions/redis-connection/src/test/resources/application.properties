#
# Minimal boot config for the redis-connection unit tests. The tests exercise the client layer and the
# health probe directly (no REST, no flows, no cloud connector); Platform.getInstance() only needs an
# application name and its virtual-thread executor (used by the health probe's background warm-up).
#
application.name=redis-connection-test
web.component.scan=org.platformlambda
cloud.connector=none
log.format=text
