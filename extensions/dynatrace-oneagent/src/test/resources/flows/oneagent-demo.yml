#
# Two sequential tasks: the linkage between them passes through Event Script's task.executor,
# which the engine runs directly (not through a worker) - the hook there keeps the chain connected.
#
flow:
  id: 'oneagent-demo'
  description: 'Two-task flow for the OneAgent invocation observer'
  ttl: 10s

first.task: 'demo.task.1'

tasks:
  - input:
      - 'input.body -> *'
    process: 'demo.task.1'
    output:
      - 'result -> model.step1'
    description: 'first task'
    execution: sequential
    next:
      - 'demo.task.2'

  - input:
      - 'model.step1 -> *'
    process: 'demo.task.2'
    output:
      - 'result -> output.body'
    description: 'second task'
    execution: end
