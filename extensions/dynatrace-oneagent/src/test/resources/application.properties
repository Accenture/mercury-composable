application.name=oneagent-demo
server.port=8305
rest.automation=true
yaml.rest.automation=classpath:/rest.yaml
web.component.scan=org.platformlambda
log.format=text
cloud.connector=none
yaml.flow.automation=classpath:/flows.yaml
#
# the master switch: with no OneAgent attached to the test JVM the real SDK is inactive and the
# setup registers nothing; the tests register an observer over a recording stand-in instead
#
dynatrace.oneagent.enabled=true
dynatrace.oneagent.destination=route
#
# the negative control of the experiment: this route never sees the incoming tag
#
invocation.observer.unlinked=demo.unlinked
