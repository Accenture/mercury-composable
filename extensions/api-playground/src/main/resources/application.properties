#
# Application name, version and description are displayed under the management endpoint "/info".
#
# When running under IDE, application.name and info.app.version will be used.
# Otherwise, the application name and version are retrieved from the packaged JAR file.
#
application.name=api-playground
info.app.version=1.0.0
info.app.description=API playground for OpenAPI 3.0
#
# The Reactive HTTP server serves the Swagger UI page (static content) and the
# REST automation endpoints in rest.yaml on this one port.
#
rest.automation=true
rest.server.port=8200
#
# Where the static content is loaded from:
#
# For embedded resources --> classpath:/public
# For files in the local file system --> file:/opt/html
#
# The welcome page is index.html
#
static.html.folder=classpath:/public
#
# scan these packages for the functions of this application
# (use comma separated list if more than one package)
#
web.component.scan=com.accenture
#
# cloud.connector = none | kafka | ...
# cloud.services = comma separated list of optional cloud services
#
cloud.connector=none
#cloud.services=some.other.cloud.services
#
# health admin endpoint dependencies
#
mandatory.health.dependencies=cloud.connector.health
#
# advanced features
#
snake.case.serialization=true
#
# An optional folder of your own OpenAPI files (yaml, yml or json). GET /api/specs lists them
# beside the files bundled under resources/sample/yaml, and the page's "Bundled" list offers them.
#
api.playground.apps=/tmp/api-playground
