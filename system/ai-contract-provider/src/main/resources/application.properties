#
# Mercury AI contract provider - a standalone composable app serving the version-matched
# operational contract for AI discovery. The application version is read from the packaged
# JAR (spring-boot build-info); the served mercury_version comes from the platform-core
# dependency itself, so nothing here needs a version bump at release time.
#
application.name=ai-contract-provider
info.app.description=Mercury operational contract discovery for AI agents
#
# Dedicated AI discovery port
#
rest.server.port=8999
rest.automation=true
#
# log.format = text | compact | json
#
log.format=text
#
# Event Script flow manifest
#
yaml.flow.automation=classpath:/flows.yaml
