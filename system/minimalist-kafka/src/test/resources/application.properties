#
# Test config for the minimalist-kafka end-to-end test (KafkaFlowAdapterTest). No REST - a pure
# event/flow processor. KafkaFlowAutoStart (@MainApplication) builds the publisher and starts the flow
# adapter (mini-test-topic -> kafka-sink-flow). Kafka client connection settings come from the
# kafka-producer.properties / kafka-consumer.properties templates; the test points those templates at the
# embedded broker by setting the KAFKA_BOOTSTRAP_SERVERS system property (resolved by their
# ${KAFKA_BOOTSTRAP_SERVERS:...} placeholder).
#
application.name=minimalist-kafka-test
web.component.scan=org.platformlambda
cloud.connector=none
rest.automation=false
log.format=text
yaml.flow.automation=classpath:/flows.yaml
yaml.kafka.flow.adapter=classpath:/kafka-flow-adapter.yaml
kafka.dlq.timeout.ms=20000
# Kafka client config templates. Listed explicitly to document the override keys; classpath is the default.
kafka.producer.properties=classpath:/kafka-producer.properties
kafka.consumer.properties=classpath:/kafka-consumer.properties
# Schema Registry: URL injected at runtime by the test as a System property under this EXACT key
# (System.setProperty("schema.registry.url", ...) - ConfigReader honors it live on every read);
# blank when unset so schema features stay off. A plain blank, not ${SCHEMA_REGISTRY_URL:}: the
# env-style reference is frozen at AppConfigReader singleton init (test-class order is
# filesystem-dependent under surefire), and a build agent exporting the env var machine-wide
# would leak into the test. The id->schema cache is in-memory (platform ManagedCache).
schema.registry.url=
schema.registry.cache.ttl=1h
# Flow-failure handling (explicit even where matching code defaults). The DLQ topic itself is per-binding
# (dlq-topic in kafka-flow-adapter.yaml), not a global setting.
kafka.flow.max.retries=3
kafka.flow.retry.backoff.ms=500
# Custom traceparent header name (escape hatch for middleware that mishandles the standard W3C
# "traceparent"): the notification stamps the trace context under BOTH names and the adapter reads
# the custom name first with the standard header as fallback. Set here so the whole test suite runs
# with the feature active, proving it is additive.
kafka.traceparent.header=x-kafka-trace
# Strict-validation codec used ONLY by SchemaCodecTest's negative test: the schema.registry.serde.*
# pass-through (here under the isolated 'schema.strict' prefix) delivers Confluent's
# json.fail.invalid.schema to BOTH serializer and deserializer, so non-conforming payloads are
# rejected instead of silently framed/decoded. The default codec above stays non-validating.
schema.strict.serde.json.fail.invalid.schema=true
schema.strict.properties=classpath:/schema-registry.properties
