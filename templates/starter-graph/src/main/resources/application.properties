application.name=starter-graph
info.app.version=1.0.0
info.app.description=Layer 3 starter - Active Knowledge Graph as the application
#
# the framework scans org.platformlambda plus the packages listed here
#
web.component.scan=com.accenture
#
# use a distinct port so a running application never collides with unit tests
#
rest.server.port=8303
rest.automation=true
#
# Event Script flow registry (the graph-executor flow exposes deployed graphs)
#
yaml.flow.automation=classpath:/flows.yaml
#
# CompileGraph quality gate (required for deployed graph execution) - validates and
# compiles the manifest-listed graph models at startup; only graphs that pass the
# gate are executable ("compiled or 404"), and the manifest's optional 'location'
# entry points at the deployed model folder (default classpath:/graph)
#
graph.model.automation=classpath:/graphs.yaml
#
# Hot deploy and undeploy of graph sets (RFC-0017) - both switches OFF by default. Either switch on makes the
# engine read the hot deployment folder at startup and on demand; the folder must be a file:/ folder the
# application can write, outside the Playground's temp folder and every manifest's 'unpack' folder. The scripts in
# scripts/ (deploy-graph-set.mjs, undeploy-graph-set.mjs) drive the entries for an engine without the Playground.
#
graph.hot.deploy=false
graph.hot.undeploy=false
location.graph.deploy=file:/tmp/deploy
#
# no service mesh - composable applications are self-contained by default
#
cloud.connector=none
#
# Dev mode - activates the MiniGraph Playground UI, the WebSocket session and the AI
# companion endpoint, so you can co-author graph models with an AI agent or by hand.
# Every one of those services is gated by @OptionalService("app.env=dev"); the matching
# rest.yaml entries are skipped when the gate is closed. Remove this line for production.
#
app.env=dev
#
# Playground panel name
#
# Optional. If present, it overrides the default name of "Minigraph Playground" in the UI
#
#playground.panel.name=Knowledge Graph Workbench
