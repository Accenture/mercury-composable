application.name=lab-worker
info.app.version=4.12.25
info.app.description=Dynatrace OneAgent lab - the Kafka entry point
web.component.scan=com.accenture.lab
cloud.connector=none
# no HTTP server: lab-worker shares the broker container's network with lab-edge, which serves port 8100
rest.automation=false
yaml.flow.automation=classpath:/flows.yaml
yaml.kafka.flow.adapter=classpath:/kafka-flow-adapter.yaml
# one JSON object per log line, which carries the log context (trace and span ids)
log.format=compact
#
# The live tracer under test, switched on by lab.sh up oneagent
dynatrace.oneagent.enabled=${DYNATRACE_ONEAGENT_ENABLED:false}
dynatrace.oneagent.destination=${DYNATRACE_ONEAGENT_DESTINATION:application}
dynatrace.oneagent.log.context=${DYNATRACE_ONEAGENT_LOG_CONTEXT:true}
