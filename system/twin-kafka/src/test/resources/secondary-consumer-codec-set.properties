#
# SecondaryConsumerCodecTest fixture: the opt-in key names a registry client template, so the secondary flow
# adapter gets its own codec under the secondary.schema.registry.consumer prefix - the twin of minimalist-kafka's
# schema.registry.consumer.properties. It reuses the module's bundled secondary template (auth block fully
# commented out - fine under the embedded registry, which enforces no access control) and layers the one
# override a per-direction installation would differ in: the consume identity pool. The embedded registry
# ignores the pool id; the test proves the wiring, not an access-control grant.
#
secondary.schema.registry.consumer.properties=classpath:/secondary-schema-registry.properties
secondary.schema.registry.consumer.serde.bearer.auth.identity.pool.id=pool-consume-test
secondary.schema.registry.consumer.cache.ttl=1h
