flow:
  id: 'l3-profile'
  description: 'Layer 3: run the profile-cache knowledge graph (action + id + profile in the payload)'
  ttl: 60s
  exception: 'graph.exception.handler'

first.task: 'graph.executor'

tasks:
  - input:
      - 'model.instance -> header.instance'
      - 'text(profile-cache) -> header.graph'
    process: 'graph.executor'
    output:
      - 'status -> output.status'
      - 'header -> output.header'
      - 'result -> output.body'
    description: 'Traverse the profile-cache graph; it reads input.body.{action,id,profile} and drives v1.cache.redis'
    execution: end

  - input:
      - 'error.code -> status'
      - 'error.message -> message'
      - 'error.stack -> stack'
    process: 'graph.exception.handler'
    output:
      - 'result.status -> output.status'
      - 'result -> output.body'
    description: 'Render a graph error (e.g. 404 Profile not found)'
    execution: end
