#
# REST automation for the sync-over-async MVP.
# The endpoint is backed by an Event Script flow (no controller) via the
# built-in 'http.flow.adapter' service - the Mercury Composable way.
#
rest:
  - service: "http.flow.adapter"
    methods: ['POST']
    url: "/api/sync-to-async"
    flow: 'sync-to-async'
    timeout: 30s
    tracing: true
  #
  # Streaming return route (E2): the facades are @EventInterceptor functions addressed
  # directly by stream:true endpoints (design D2 - no Event Script composition on this path).
  # The endpoint timeout is the edge idle allowance; the facade overrides it per request
  # via EventStreamWriter.first(status, contentType, ttlSeconds) through StreamBridge.
  #
  - service: "chat.stream.facade"
    methods: ['POST']
    url: "/api/chat"
    timeout: 15s
    stream: true
    tracing: true
  - service: "notify.stream.facade"
    methods: ['GET']
    url: "/api/notifications"
    timeout: 15s
    stream: true
    tracing: true
