#
# Declarative Event-over-HTTP targets: routes that live on polyglot peers.
#
# The support-triage demo graph's AI node (llm.chat), the order-assistant demo graph's
# agent loop (llm.run sends each model turn to llm.chat) and the streaming relay's AI
# node (llm.stream) reach functions in the LLM helper: mercury-python's
# extensions/llm-helper (default port 8086) or mercury-nodejs's extensions/llm-helper
# (port 8087). Run one with the credential in its environment:
#
#     mercury-serve extensions/llm-helper/llm_helper.py            (mercury-python)
#     node dist/src/cli.js extensions/llm-helper/llm-helper.mjs    (mercury-nodejs)
#
# with ANTHROPIC_API_KEY exported in that app's environment - the graph names a
# route, not a provider, and does not change. Select the Node.js helper, or any
# other peer, with the -Dllm.peer.host / -Dllm.peer.port overrides.
#
event:
  http:
    - route: 'llm.chat'
      target: 'http://${llm.peer.host:127.0.0.1}:${llm.peer.port:8086}/api/event'
    - route: 'llm.stream'
      target: 'http://${llm.peer.host:127.0.0.1}:${llm.peer.port:8086}/api/event'
    #
    # The diagram-assistant demo graph's one tool is an MCP server's: diagram.render is served by the
    # MCP binding of a language pack (mercury-python extensions/mcp-binding on port 8088, or
    # mercury-nodejs on 8089), bound to a Mermaid MCP server by mcp/mermaid-servers.yml in this
    # folder - run the binding with -Dmcp.servers=<absolute path of that file>. The graph names the
    # route; the binding names the server; the engine stays MCP-free.
    #
    - route: 'diagram.render'
      target: 'http://${mcp.peer.host:127.0.0.1}:${mcp.peer.port:8088}/api/event'
