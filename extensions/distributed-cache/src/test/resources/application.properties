#
# Minimal boot config for the distributed-cache unit tests. The store and function tests build the byte[]
# backend directly against an embedded Redis (RedisTestBase, port 16383) and do not read these keys; only
# the health-check subclass reads redis.host/redis.port here, and Platform.getInstance() needs an app name
# plus its virtual-thread executor (the health probe's background warm-up).
#
application.name=distributed-cache-test
web.component.scan=org.platformlambda
cloud.connector=none
log.format=text
#
# The cache reads the plain redis.* namespace (shared with any other redis.* consumer via the fallback).
# Listed at the defaults so the health-check test's href assertion is deterministic (127.0.0.1:6379).
#
redis.cache.enabled=true
redis.host=127.0.0.1
redis.port=6379
redis.cache.default.ttl=1h
redis.cache.key.prefix=
