#
# Common configuration for the sync-over-async worked example.
#
# The same jar runs in one of two roles, selected by the active Spring profile:
#   facade  -> -Dspring.profiles.active=facade   (REST + sync-to-async + soa-reply + Redis coordinator)
#   backend -> -Dspring.profiles.active=backend  (system-of-record; no REST, no Redis)
# Profile-specific settings live in application-facade.properties / application-backend.properties.
#
application.name=sync-over-async-demo
web.component.scan=com.accenture
cloud.connector=none
log.format=text

# Kafka client connection comes from the templates bundled in minimalist-kafka; their default bootstrap is
# ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092} - i.e. the local kafka-standalone helper.
kafka.producer.properties=classpath:/kafka-producer.properties
kafka.consumer.properties=classpath:/kafka-consumer.properties
# dead-letter confirm-write timeout; flow processing is bounded by each flow's own ttl
kafka.dlq.timeout.ms=10000

# Confluent Schema Registry (the local schema-registry-standalone helper) for the JSON-Schema demo path
# (json-topic-1 / json-topic-2). The byte[] path (soa.request / soa.response) does not use it.
schema.registry.url=${SCHEMA_REGISTRY_URL:http://127.0.0.1:8081}
# id->schema cache TTL. 30m lets schema changes be picked up while running (no pod restart); not-found is
# never cached, so a newly-registered schema is visible immediately. Lengthen it in production if desired.
schema.registry.cache.ttl=30m

# --- Optional: a separate Schema Registry identity for the CONSUMER side (the Kafka flow adapter) ---
# By default one codec - one registry identity, from schema-registry.properties - serves both directions.
# Some Confluent installations grant CSFLE key (KEK) access per direction - a produce identity pool and a
# consume identity pool - so no single identity can decrypt everything a service consumes. The opt-in is the
# PRESENCE of schema.registry.consumer.properties; unset or blank leaves the adapter on the producer's codec,
# so schema.registry.consumer.properties=${SCHEMA_REGISTRY_CONSUMER_PROPERTIES:} stays off until that variable
# is exported - a per-environment switch. schema.registry.url stays the feature switch and is shared: a consumer
# decodes ids minted by the registry its producers use. The local schema-registry-standalone helper enforces no
# identity pools, so these lines illustrate the wiring, not an access grant.
#
# Variant A - the SAME template as the producer, plus the one override that differs (the consume pool id). The
# override reaches the deserializer and the DEK-registry client CSFLE builds from it, where key access is
# decided; the codec's own schema lookups keep the template's identity:
# schema.registry.consumer.properties=classpath:/schema-registry.properties
# schema.registry.consumer.serde.bearer.auth.identity.pool.id=${SCHEMA_REGISTRY_CONSUME_POOL_ID:}
#
# Variant B - a SECOND template carrying the consume identity outright (schema-registry-consumer.properties,
# next to this file), so the codec's own schema lookups authenticate with it as well:
# schema.registry.consumer.properties=classpath:/schema-registry-consumer.properties
#
# Either way the consumer codec reads ONLY its own prefix - a KMS driver credential set under
# schema.registry.serde.* must be repeated under schema.registry.consumer.serde.* - and it takes its own cache TTL:
# schema.registry.consumer.cache.ttl=30m

# Redis return-route settings (used by the facade role; the local redis-standalone helper).
soa.redis.host=127.0.0.1
soa.redis.port=6379
soa.redis.username=${REDIS_USERNAME:}
soa.redis.password=${REDIS_PASSWORD:}
soa.redis.ssl=false
soa.redis.database=0
soa.redis.timeout.ms=5000
# Redis Cluster selection: detect=auto probes at start-up (the local helper is standalone). To force it by
# config instead, set detect to off and use the boolean: soa.redis.cluster.detect=off + soa.redis.cluster.mode=true
soa.redis.cluster.detect=auto
soa.redis.cluster.mode=false
sync.return.channel.prefix=svc-return
sync.route.ttl.seconds=90
sync.response.ttl.seconds=30
sync.max.pending.requests=10000
