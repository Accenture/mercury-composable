#
# Test configuration for the emulated-LLM round-trip (StreamingLlmEmulatedTest): ONE JVM plays
# every role - the stream-ui facade, the stream producer, AND the LLM provider itself.
# llm.gemini.host points back at this application, where a test-scope stub endpoint
# (MockGeminiEndpoint) serves Gemini-shaped SSE frames - so the full circle
# produce(llm) -> SSE consumer -> bridge -> rendezvous -> SSE edge runs in CI with no
# network and no API key. (Test resources shadow the main application.properties on the
# surefire classpath; the plain unit tests in this module read no configuration.)
#
application.name=sync-over-async-demo-test
web.component.scan=com.accenture
cloud.connector=none
log.format=text

rest.automation=true
rest.server.port=8611
yaml.rest.automation=classpath:/rest-emulated-llm.yaml

# the streaming rendezvous (embedded Redis is started by the test on this port)
sync.over.async.enabled=true
redis.host=127.0.0.1
redis.port=16479
redis.password=
redis.ssl=false
redis.database=0
redis.timeout.ms=5000
sync.return.channel.prefix=svc-return
sync.stream.ttl.seconds=60

# no Kafka anywhere in this test
kafka.producer.enabled=false
kafka.consumer.enabled=false

# the emulated provider: this very application. The key stays a pure environment
# placeholder here - no literal for a secret scanner (or the memory pre-commit guard) to
# flag; the test bootstrap injects a dummy as a system property, which ConfigReader
# resolves before this file. The stub provider never reads it.
llm.api.key=${GEMINI_API_KEY:}
llm.gemini.model=emulated-model
llm.gemini.host=http://127.0.0.1:8611
