#
# Declarative Event-over-HTTP targets: routes that live on polyglot peers.
#
# The support-triage demo graph's AI node (llm.chat), the order-assistant demo graph's
# agent loop (llm.run sends each model turn to llm.chat) and the streaming relay's AI
# node (llm.stream) reach functions in the LLM helper: mercury-python's
# extensions/llm-helper (default port 8086) or mercury-nodejs's extensions/llm-helper
# (port 8087). Run one with the credential in its environment:
#
#     mercury-serve extensions/llm-helper/llm_helper.py            (mercury-python)
#     node dist/src/cli.js extensions/llm-helper/llm-helper.mjs    (mercury-nodejs)
#
# with ANTHROPIC_API_KEY exported in that app's environment - the graph names a
# route, not a provider, and does not change. Select the Node.js helper, or any
# other peer, with the -Dllm.peer.host / -Dllm.peer.port overrides.
#
event:
  http:
    - route: 'llm.chat'
      target: 'http://${llm.peer.host:127.0.0.1}:${llm.peer.port:8086}/api/event'
    - route: 'llm.stream'
      target: 'http://${llm.peer.host:127.0.0.1}:${llm.peer.port:8086}/api/event'
    #
    # The diagram-assistant demo graph's tool reaches an MCP server: mermaid.render is a function of the
    # MCP binding of a language pack (mercury-python extensions/mcp-binding on port 8088, or
    # mercury-nodejs on 8089), bound in the binding's code to the tool of a Mermaid MCP server named in
    # its server file (mcp/mermaid-servers.yml in this folder is a copy of that server entry). The
    # graph's catalog names diagram.render, a function of this application (DiagramRender) that calls
    # mermaid.render and stores the rendered image out of band; a route names the capability, never the
    # transport; the engine stays MCP-free.
    #
    - route: 'mermaid.render'
      target: 'http://${mcp.peer.host:127.0.0.1}:${mcp.peer.port:8088}/api/event'
    #
    # The built-in agent tools (RFC-0013) of a language pack's extensions/agent-tools - files inside one
    # workspace, the web inside an allowlist, the agent's knowledge graph inside one database, a clock -
    # reached by the site-notes, document-ingest and document-query demo graphs. Run the Python extension
    # (port 8089) or the Node.js one (8090) with the sandboxes this application's corpus and the demo
    # need, for example:
    #
    #     mercury-serve extensions/agent-tools/agent_tools.py \
    #       -Dtools.file.root=<path to examples/minigraph-playground/corpus> \
    #       -Dtools.web.allow=accenture.github.io -Dtools.graph.uri=bolt://127.0.0.1:7687 -Dtools.graph.write=true
    #
    # Select the Node.js extension, or any other peer, with -Dtools.peer.host / -Dtools.peer.port.
    # One route per entry: the map does not take a comma-separated list.
    #
    - route: 'file.read'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'file.write'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'file.list'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'file.search'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'file.extract'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'web.fetch'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'web.crawl'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'graph.schema'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'graph.query'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'graph.write'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'graph.ingest'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    - route: 'time.now'
      target: 'http://${tools.peer.host:127.0.0.1}:${tools.peer.port:8089}/api/event'
    #
    # Ask a person (RFC-0014): person.ask is a function of a language pack's extensions/ask-person (mercury-python on
    # port 8091). The order-assistant and plan-assistant demo graphs call it on their hold path, before they suspend:
    # it issues the ticket, builds the resume link and sends one message event to the installation's channels - the
    # agent-question app, a chat, mail - and the graph knows no channel. Run it with the ticket key in its environment
    # and this application's graph entries in its allowlist, for example:
    #
    #     mercury-serve extensions/ask-person/ask_person.py -Dask.ticket.key='${ASK_TICKET_KEY}' \
    #       -Dask.graphs='order-assistant=http://127.0.0.1:8085/api/graph/order-assistant,plan-assistant=http://127.0.0.1:8085/api/graph/plan-assistant'
    #
    # Select another peer with -Dask.peer.host / -Dask.peer.port. A pack that is down never fails the hold: the graphs
    # advise the caller without a link.
    #
    - route: 'person.ask'
      target: 'http://${ask.peer.host:127.0.0.1}:${ask.peer.port:8091}/api/event'
