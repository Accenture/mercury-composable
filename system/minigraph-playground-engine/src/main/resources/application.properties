spring.application.name=minigraph-playground
info.app.version=3.0.0
info.app.description=MiniGraph Playground
#
# Server port when running locally
#
rest.server.port=8085
rest.automation=true
yaml.rest.automation=classpath:/rest.yaml
#
# Event script configuration file location
#
yaml.flow.automation=classpath:/flows.yaml
#
# log.format = text | compact | json
# text and json are for human readers
# compact is json without pretty print. It is for log analytics consumption.
#
log.format=text
#
# DO NOT CHANGE the URL path for static content
#
spring.mvc.static-path-pattern=/**
#
# Where to load the static files:
#
# For embedded resources --> classpath:/public/
# For files in local file system --> file:/opt/html/
#
# Please add welcome page as "index.html"
#
spring.web.resources.static-locations=classpath:/public/
#
# scan these packages for WebServlets, RestControllers and Spring components
# (use command separated list if more than one package)
#
web.component.scan=com.accenture

#
# websocket configuration
#
#websocket.idle.timeout=60

#
# cloud.connector = none | kafka | ...
# cloud.services = comma separated list of optional cloud services
#
cloud.connector=none
#cloud.services=some.other.service

#
# health admin endpoint dependencies
# Please turn on mandatory.health.dependencies=cloud.connector.health if cloud.connector is not "none"
#
mandatory.health.dependencies=graph.health
#optional.health.dependencies=other.service.health

#
# advanced features
#
snake.case.serialization=true

#
# You can add environment variables and application properties (comma separated list) here
# for the "/env" endpoint to display
#
#show.env.variables=YOUR_ENV_VARIABLES
show.application.properties=rest.server.port, spring.application.name

#
# temp graph working location
# (temp graph location must use "file:/" prefix because of READ/WRITE requirements
#
location.graph.temp=file:/tmp/graph
#
# Hot deploy and undeploy of graph sets (RFC-0017) - both switches OFF by default.
# Either switch on makes the engine read the hot deployment folder at startup and on demand:
# graph.hot.deploy registers POST /api/graph-set/deploy, graph.hot.undeploy registers
# POST /api/graph-set/undeploy/{graph-id}; GET /api/graph-set/deployed answers under either.
# The folder must be a file:/ folder the application can write, outside the temp folder above
# and outside every manifest's 'unpack' folder; mount it as a persistent volume to survive a restart.
# graph.hot.deploy.throttle is the least time in ms between two reads of a set's record (0 = every lookup).
#
graph.hot.deploy=false
graph.hot.undeploy=false
location.graph.deploy=file:/tmp/deploy
#graph.hot.deploy.throttle=0
#
# stepwise traversal logging for deployed graph execution (graph.executor) -
# the same trail the Playground dry-run prints ("Walk to {node}",
# "Executed {node} with skill {skill} in {time} ms", "Graph traversal completed
# in {time} ms"), as INFO structured records {id, text, graph} where id is the
# trace id (fallback: flow instance id) so OTel dashboards can join logs with
# spans; log.format=json/compact render the record as indexable key-values.
# Set to false (e.g. -Dgraph.traversal.log=false) to reduce log noise.
#
graph.traversal.log=true
#
# set this value to an environment variable in the deployed environment to disable websocket endpoints
# when the app.env is not 'dev'. e.g. app.env={$ENV_NAME}
#
app.env=dev
