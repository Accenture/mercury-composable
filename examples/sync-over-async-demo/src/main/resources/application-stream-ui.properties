#
# Stream-UI role: the pod holding the user's SSE connection (streaming return route).
#   java -Dspring.profiles.active=stream-ui -jar target/sync-over-async-demo-<version>.jar
# Run more than one on a dev machine by overriding the port (-Drest.server.port=8602).
#
# Broker-free by design (spec D3): the streaming return path needs Redis only, so the Kafka
# building blocks bundled in the jar are switched off for this role.
#
rest.automation=true
rest.server.port=8600
yaml.rest.automation=classpath:/rest-stream-ui.yaml

# the streaming rendezvous rides the same return-route coordinator as the one-shot pattern
sync.over.async.enabled=true
sync.stream.ttl.seconds=1800
sync.max.pending.streams=1000

# no Kafka in this role
kafka.producer.enabled=false
kafka.consumer.enabled=false
