#
# REST automation for the stream-ui role. The notification channel is an @EventInterceptor
# addressed directly by a stream:true endpoint (streaming-return-route design D2 - no Event
# Script composition on this path). The endpoint timeout is the edge idle allowance; the
# facade overrides it per request (x-stream-idle-seconds) via StreamBridge.
#
rest:
  - service: "demo.stream.facade"
    methods: ['GET']
    url: "/api/notifications"
    timeout: 60s
    stream: true
    tracing: true
